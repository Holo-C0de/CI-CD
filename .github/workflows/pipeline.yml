name: Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint HTML
        run: |
          if grep -q "<html" index.html && grep -q "</html>" index.html; then
            echo "HTML structure OK"
          else
            echo "ERROR: broken HTML"
            exit 1
          fi

      - name: Build Docker image
        if: always()
        run: docker build -t test-image .

      - name: Smoke test container
        if: always()
        run: |
          docker run -d -p 8080:80 --name test-container test-image
          sleep 2
          if curl -s http://localhost:8080 | grep -q "Holo-C0de"; then
            echo "OK"
          else
            echo "FAILED: page does not contain username"
            exit 1
          fi
          docker stop test-container

  release:
    needs: ci
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/holo-c0de/ci-cd:latest
